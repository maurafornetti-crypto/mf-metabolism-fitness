<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MF metabolism &amp; fitness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una colonna mobile-first. Elenco clienti, poi scheda cliente con barra a 4 sezioni in basso. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface-2:#E7EEEA; --fg:#13302A; --muted:#58706A; --line:#D3DDD8;
  --accent:#1B6B52; --accent-fg:#FFFFFF; --accent-soft:#D9EEE4;
  --ai:#2C5AA0; --ai-soft:#E2EBF8;
  --ok:#2A7A4B; --ok-soft:#DDF0E4; --warn:#9A5B08; --warn-soft:#F8E8C8; --bad:#B0332A; --bad-soft:#F7DDD9;
  --f-display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1916; --surface:#15251F; --surface-2:#1D3029; --fg:#E3EEE9; --muted:#92A8A0; --line:#2A3F37;
    --accent:#5CC9A0; --accent-fg:#0A1F17; --accent-soft:#1D3A2F;
    --ai:#8DB4F0; --ai-soft:#1B2B45;
    --ok:#6FCF97; --ok-soft:#1B3527; --warn:#E3A44C; --warn-soft:#3A2D14; --bad:#F0877C; --bad-soft:#40201C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#15251F; --surface-2:#1D3029; --fg:#E3EEE9; --muted:#92A8A0; --line:#2A3F37;
  --accent:#5CC9A0; --accent-fg:#0A1F17; --accent-soft:#1D3A2F;
  --ai:#8DB4F0; --ai-soft:#1B2B45;
  --ok:#6FCF97; --ok-soft:#1B3527; --warn:#E3A44C; --warn-soft:#3A2D14; --bad:#F0877C; --bad-soft:#40201C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:760px;margin:0 auto;padding-bottom:120px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top h1{font-size:20px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;display:flex;align-items:baseline;gap:8px;flex:1}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
#savestat{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
#savestat.err{color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer;text-align:center}
.btn.sec{background:transparent;color:var(--accent)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
:root[data-theme="dark"] .btn.ai{color:#0B1A30}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ai{color:#0B1A30}}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--fg)}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn.danger.on{background:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,.tab:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}

/* cards & sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.sec-title{font-size:13px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;margin:22px 0 10px}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:17px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
details.grp>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px;transition:transform .15s}
details.grp[open]>summary::after{transform:rotate(-135deg)}
details.grp .body{padding:2px 16px 16px;display:grid;gap:14px}

/* fields */
label.f{display:grid;gap:5px;min-width:0}
label.f>span.l{font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.u{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=time],select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:88px;line-height:1.4}
input.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.grid.w2{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.aitag{font-family:var(--f-mono);font-size:10px;font-weight:500;background:var(--ai-soft);color:var(--ai);border-radius:5px;padding:1px 5px;letter-spacing:.04em}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ai{background:var(--ai-soft);color:var(--ai)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* AI panel */
.aipanel{border:1px solid var(--ai);background:var(--ai-soft);border-radius:14px;padding:16px;display:grid;gap:12px}
.aipanel h2{font-size:18px;color:var(--ai)}
.aipanel p{margin:0}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--surface-2)}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg ul{margin:6px 0 0;padding-left:18px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}

/* client list */
.cl{display:grid;gap:10px;margin-top:14px}
.ci{display:grid;gap:4px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.ci b{font-family:var(--f-display);font-size:18px;font-weight:600}
.ci .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:28px 6px;display:grid;gap:12px}
.empty h2{font-size:24px}
.steps{display:grid;gap:10px;margin:6px 0 0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps .n{font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;height:28px;display:grid;place-items:center}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);background:var(--accent-soft)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* measures */
.derived{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.dv{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.dv b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.dv span{font-size:12px;color:var(--muted)}
.mi{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.mi .d{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.mi .vals{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:14px}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pe{fill:var(--accent);stroke:var(--accent)}

/* plan */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macros .dv b{font-size:17px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.meal .mh{display:flex;gap:8px;align-items:center}
.meal .mh input.nm{font-family:var(--f-display);font-weight:600;font-size:17px;border-color:transparent;background:transparent;padding-left:0;min-height:38px}
.meal .mh input.tm{width:92px;flex:none;font-family:var(--f-mono);font-size:13px}
.voce{display:grid;grid-template-columns:minmax(0,1fr) 92px 36px;gap:6px;align-items:center}
.voce input{min-height:40px;padding:8px 10px}
.voce input.q{font-family:var(--f-mono);font-size:13px}
.voce .nt{grid-column:1/3;min-height:34px;font-size:13px;color:var(--muted)}
.xbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:18px;line-height:1}
.est{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
ul.clean{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.hr{height:1px;background:var(--line);border:0;margin:6px 0}
.foot{font-size:12px;color:var(--muted);margin-top:18px}

/* agenda */
.cnav{display:flex;align-items:center;gap:8px}
.cnav h2{flex:1;text-align:center;font-size:20px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:54px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 2px 4px;display:grid;grid-template-rows:auto 1fr;justify-items:center;align-items:start;cursor:pointer;font-weight:600;min-width:0}
.day.out{background:transparent;border-color:transparent;color:var(--muted);cursor:default}
.day.today{border-color:var(--accent);border-width:2px}
.day.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.day .dots{display:flex;gap:3px;align-items:center;font-family:var(--f-mono);font-size:10px;font-weight:500}
.day i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.day.on i{background:var(--accent-fg)}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ap{display:grid;grid-template-columns:58px minmax(0,1fr);gap:4px 12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.ap .t{font-family:var(--f-mono);font-size:15px;font-weight:500}
.ap .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ap .s{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ap.x{opacity:.6}
.ap.x .n{text-decoration:line-through}
.seg{display:flex;gap:8px}
.seg .chip{flex:1;text-align:center}
.lr{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;align-items:baseline}
.lr .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lr .c{min-width:0;overflow:hidden;text-overflow:ellipsis}
.lr .c small{display:block;color:var(--muted);font-size:12px}
.lr .a{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.lr .a.in{color:var(--ok)}
.lr .a.out{color:var(--bad)}
.hbar{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar.u .bar i{background:var(--warn)}
.hbar .vv{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.dv.in b{color:var(--ok)}.dv.out b{color:var(--bad)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.check{display:flex;gap:10px;align-items:center;min-height:40px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.tabbar.five .tab{font-size:11px}
.tabbar.six .tab{font-size:10px;padding-left:0;padding-right:0}
.gfigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.gfig{max-height:300px}
.gl{margin:6px 0;padding-left:18px;font-size:14px;line-height:1.5}
.gl li{margin-bottom:6px}
.guide ol.gl li{padding:6px 0;border-top:1px solid var(--line)}
.chartbox{overflow:hidden}
.subt{font-family:var(--f-display);font-weight:600;font-size:15px;margin:8px 0 -2px}
.subt:first-child{margin-top:0}
</style></head><body>

function ageOf(){var c=S.client&&S.client.int;if(!c)return null;if(c.nascita){var b=new Date(c.nascita+'T00:00:00');if(!isNaN(b)){var t=new Date(),a=t.getFullYear()-b.getFullYear(),m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;if(a>=0&&a<120)return a}}var a2=parseInt(c.eta,10);return isFinite(a2)?a2:null}
function sexOf(){var s=S.client&&S.client.int&&S.client.int.sesso;return s==='M'||s==='F'?s:null}
function isMinor(){var a=ageOf();return a!=null&&a<18}
var JP3={M:['pettorale','addominale','coscia'],F:['tricipitale','sovrailiaca','coscia']};
function fatJP3(m,age,sex){
  if(!age||!sex||age<18)return null;
  var sum=0,k=JP3[sex];for(var i=0;i<k.length;i++){var v=num(m.pliche&&m.pliche[k[i]]);if(v==null)return null;sum+=v}
  var db=sex==='M'?1.10938-0.0008267*sum+0.0000016*sum*sum-0.0002574*age:1.0994921-0.0009929*sum+0.0000023*sum*sum-0.0001392*age;
  var p=495/db-450;return isFinite(p)&&p>0&&p<70?p:null}
function fatJP7(m,age,sex){
  if(age!=null&&age<18)return null;
  var sum=0;for(var i=0;i<JP7.length;i++){var v=num(m.pliche&&m.pliche[JP7[i]]);if(v==null)return null;sum+=v}
  if(!age||!sex)return null;
  var db=sex==='M'?1.112-0.00043499*sum+0.00000055*sum*sum-0.00028826*age:1.097-0.00046971*sum+0.00000056*sum*sum-0.00012828*age;
  var p=495/db-450;return isFinite(p)&&p>0&&p<70?p:null}
function fatPct(m){var b=num(m.bia&&m.bia.massa_grassa_pct);if(b!=null)return b;var a=ageOf(),s=sexOf();var j=fatJP7(m,a,s);return j!=null?j:fatJP3(m,a,s)}
function sumPliche(m){var s=0,n=0;PLICHE.forEach(function(p){var v=num(m.pliche&&m.pliche[p[0]]);if(v!=null){s+=v;n++}});return n?s:null}
function derived(m){
  var out=[];var w=num(m.peso),h=num(m.altezza);
  if(w&&h){var bmi=w/Math.pow(h/100,2);out.push(['IMC',fmt(bmi,1),'kg/m²']);}
  var vita=num(m.circ&&m.circ.vita),fia=num(m.circ&&m.circ.fianchi);
  if(vita&&fia)out.push(['Vita / fianchi',fmt(vita/fia,2),'']);
  if(vita&&h)out.push(['Vita / altezza',fmt(vita/h,2),'']);
  var sp=sumPliche(m);if(sp!=null)out.push(['Somma pliche',fmt(sp,1),'mm']);
  var j=fatJP7(m,ageOf(),sexOf());if(j!=null)out.push(['% grasso (JP7)',fmt(j,1),'%']);
  var j3=fatJP3(m,ageOf(),sexOf());if(j3!=null)out.push(['% grasso (JP3)',fmt(j3,1),'%']);
  if(isMinor()&&(sumPliche(m)!=null))out.push(['% grasso da pliche','non calcolato: formule per adulti','']);
  pctRows(m).forEach(function(r){out.push(r)});
  var mg=num(m.bia&&m.bia.massa_grassa_pct);if(mg!=null&&w)out.push(['Massa grassa',fmt(w*mg/100,1),'kg']);
  return out}
function latestMeasure(){return S.measures[0]||null}
var LAF=[['1.2','Sedentario (1,2)'],['1.375','Poco attivo (1,375)'],['1.55','Moderatamente attivo (1,55)'],['1.725','Molto attivo (1,725)']];
var GOALS=[['dimagrimento','Dimagrimento (-15%)',0.85],['mantenimento','Mantenimento',1],['massa','Aumento massa (+10%)',1.1]];
function bmrOf(m){
  var b=num(m&&m.bia&&m.bia.metabolismo_basale_kcal);var w=num(m&&m.peso),h=num(m&&m.altezza),a=ageOf(),s=sexOf();
  var mif=(w&&h&&a&&s)?(10*w+6.25*h-5*a+(s==='M'?5:-161)):null;
  return {mif:mif,bia:b}}
function calcNeeds(set){
  var m=latestMeasure();var b=bmrOf(m);var bmr=set.metodo==='bia'&&b.bia?b.bia:(b.mif||b.bia);
  if(!bmr)return null;
  var tdee=bmr*parseFloat(set.laf||'1.375');
  var g=GOALS.filter(function(x){return x[0]===set.obiettivo})[0]||GOALS[0];
  var kcal=Math.round(tdee*g[2]/10)*10;
  var w=num(m&&m.peso)||70;
  var prot=Math.round(w*(set.obiettivo==='mantenimento'?1.3:1.6));
  var fat=Math.round(kcal*0.28/9);
  var carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:kcal,prot:prot,carb:carb,fat:fat}}

function series(fn){

function lineChart(title,pts,unit,dec){
  if(pts.length<2)return '';

  if(mx===mn){mx+=1;mn-=1}var pad=(mx-mn)*0.15;mn-=pad;mx+=pad;
  var t0=dateMs(pts[0].d),t1=dateMs(pts[pts.length-1].d),span=(t1-t0)||1;
  var X=function(p){return L+(dateMs(p.d)-t0)/span*(W-L-R)},Y=function(v){return T+(1-(v-mn)/(mx-mn))*(H-T-B)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(title)+'">';

  s+='<polyline class="ln" points="'+pts.map(function(p){return X(p).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ')+'"/>';

/* triangolo di composizione corporea (dati della bilancia BIA) */
function bodyComp(m){
  var w=num(m.peso),b=m.bia||{};if(!w)return null;
  var f=num(b.massa_grassa_kg);if(f==null){var fp=num(b.massa_grassa_pct);if(fp!=null)f=w*fp/100}
  var mu=num(b.massa_muscolare_kg);if(f==null||mu==null)return null;
  var wa=num(b.acqua_totale_l);if(wa==null){var wp=num(b.acqua_totale_pct);if(wp!=null)wa=w*wp/100}
  if(wa==null||!(f>=0)||!(mu>=0)||!(wa>=0))return null;
  var t=f+mu+wa;if(!(t>0))return null;
  return {f:f/t*100,m:mu/t*100,r:wa/t*100}}
function bodyTriangle(){
  var pts=S.measures.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date))}).map(function(m){var c=bodyComp(m);return c?{d:m.date,c:c}:null}).filter(Boolean);
  if(!pts.length)return '';
  var W=340,H=290,T=[170,28],L=[34,262],R=[306,262];
  var P=function(c){var a=c.m/100,bb=c.f/100,cc=c.r/100;return [a*T[0]+bb*L[0]+cc*R[0],a*T[1]+bb*L[1]+cc*R[1]]};
  var s='<div class="card stack"><b style="font-family:var(--f-display)">Composizione corporea (BIA)</b><svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Triangolo di composizione corporea">';
  s+='<polygon points="'+T.join(',')+' '+L.join(',')+' '+R.join(',')+'" fill="none" stroke="var(--line)" stroke-width="1.5"/>';
  [20,40,60,80].forEach(function(k){
    var a=k/100;
    var p1=P({m:k,f:100-k,r:0}),p2=P({m:k,f:0,r:100-k});s+='<line class="gr" x1="'+p1[0]+'" y1="'+p1[1]+'" x2="'+p2[0]+'" y2="'+p2[1]+'"/>';

var CAT_IN=['Visite','Piani alimentari','Consulenze online','Corsi e workshop','Altro'];
var CAT_OUT=['Affitto studio','Software e abbonamenti','Formazione','Materiali e strumenti','Tasse e contributi','Assicurazione','Marketing','Commercialista','Altro'];
function inPeriod(e){var l=S.ui.led,p=l.mode==='anno'?String(l.y):l.y+'-'+pad2(l.m+1);return String(e.date||'').indexOf(p)===0}
function sumBy(list,tipo){return list.filter(function(e){return e.tipo===tipo}).reduce(function(a,e){return a+(num(e.importo)||0)},0)}
function catRows(list,tipo,cls){
  var m={};list.filter(function(e){return e.tipo===tipo}).forEach(function(e){m[e.categoria||'Altro']=(m[e.categoria||'Altro']||0)+(num(e.importo)||0)});
  var keys=Object.keys(m).sort(function(a,b){return m[b]-m[a]});if(!keys.length)return '<div class="small muted">Nessun movimento.</div>';
  var mx=m[keys[0]]||1;
  return keys.map(function(k){return '<div class="hbar '+cls+'"><span>'+esc(k)+'</span><span class="bar"><i style="width:'+Math.max(3,Math.round(m[k]/mx*100))+'%"></i></span><span class="vv">'+eur(m[k])+'</span></div>'}).join('')}
function yearChart(y){
  var ent=[],usc=[];for(var i=0;i<12;i++){var p=y+'-'+pad2(i+1);var l=S.ledger.filter(function(e){return String(e.date||'').indexOf(p)===0});ent.push(sumBy(l,'entrata'));usc.push(sumBy(l,'uscita'))}
  var mx=Math.max.apply(null,ent.concat(usc).concat([1]));var step=Math.pow(10,Math.floor(Math.log10(mx)));var top=Math.ceil(mx/step)*step;
  var W=340,H=150,L=40,R=6,T=10,B=22,bw=(W-L-R)/12;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Entrate e uscite per mese nel '+y+'">';
  [0,top/2,top].forEach(function(v){var yy=T+(1-v/top)*(H-T-B);s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(L-5)+'" y="'+(yy+3)+'" text-anchor="end">'+(v>=1000?fmt(v/1000,1)+'k':Math.round(v))+'</text>'});
  for(var j=0;j<12;j++){var x=L+j*bw;var h1=ent[j]/top*(H-T-B),h2=usc[j]/top*(H-T-B);
    s+='<rect x="'+(x+bw*0.12).toFixed(1)+'" y="'+(H-B-h1).toFixed(1)+'" width="'+(bw*0.36).toFixed(1)+'" height="'+h1.toFixed(1)+'" rx="1.5" fill="var(--accent)"/>';
    s+='<rect x="'+(x+bw*0.5).toFixed(1)+'" y="'+(H-B-h2).toFixed(1)+'" width="'+(bw*0.36).toFixed(1)+'" height="'+h2.toFixed(1)+'" rx="1.5" fill="var(--warn)"/>';
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+MESI[j].slice(0,1).toUpperCase()+'</text>'}
  return s+'</svg>'}

  h+='<div class="derived" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="dv in"><b style="font-size:15px">'+eur(e)+'</b><span>Entrate</span></div><div class="dv out"><b style="font-size:15px">'+eur(u)+'</b><span>Uscite</span></div><div class="dv"><b style="font-size:15px">'+(e-u<0?'−':'')+eur(Math.abs(e-u))+'</b><span>Saldo</span></div></div>';

  if(list.length){

      return '<button class="lr" data-act="openLed" data-id="'+esc(x.id)+'"><span class="d">'+esc(shortDate(x.date))+'</span><span class="c">'+esc(x.descrizione||x.categoria||'')+'<small>'+esc(x.categoria||'')+(x.cliente?' · '+esc(x.cliente):'')+'</small></span><span class="a '+(inn?'in':'out')+'">'+(inn?'+':'−')+eur(num(x.importo))+'</span></button>'}).join('')}
  else h+='<div class="card flat"><b>'+(S.ledgerLoaded?'Nessun movimento in questo periodo.':'Carico i movimenti…')+'</b><p class="muted" style="margin:6px 0 0">Tocca Movimento per aggiungere un\'entrata (una visita pagata) o un\'uscita (affitto, abbonamenti, formazione). I dati restano nel tuo spazio personale.</p></div>';
  return h+'</div>'+mainTabs('bilancio')}

async function saveLed(){

async function exportLedger(){
  var list=S.ledger.filter(inPeriod).sort(function(a,b){return String(a.date).localeCompare(String(b.date))});
  var q=function(s){s=String(s==null?'':s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  var rows=['Data;Tipo;Categoria;Descrizione;Cliente;Importo'].concat(list.map(function(e){return [e.date,e.tipo,e.categoria,e.descrizione,e.cliente,String(num(e.importo)).replace('.',',')].map(q).join(';')}));

function moreClick(a,el,id){
  var c=S.ui.cal,l=S.ui.led;
  if(S.view==='client'&&S.tab==='allenamento'&&S.train!==undefined&&moreTrainClick(a,el))return true;
  switch(a){
   case 'nav':flushAll();S.view=el.getAttribute('data-t');S.client=null;S.cid=null;S.ui.apptForm=null;S.ui.ledForm=null;render();return true;
   case 'calPrev':c.m--;if(c.m<0){c.m=11;c.y--}render();return true;
   case 'calNext':c.m++;if(c.m>11){c.m=0;c.y++}render();return true;
   case 'calToday':var t=new Date();c.y=t.getFullYear();c.m=t.getMonth();c.sel=today();render();return true;
   case 'selDay':c.sel=el.getAttribute('data-d');render();return true;
   case 'newAppt':openApptForm(null);return true;
   case 'openAppt':var ap=S.appts.filter(function(x){return x.id===id})[0];if(ap){var p=ap.date.split('-');c.y=+p[0];c.m=+p[1]-1;c.sel=ap.date;openApptForm(ap)}return true;
   case 'apptCancel':S.ui.apptForm=null;render();return true;

   case 'ledNext':if(l.mode==='anno')l.y++;else{l.m++;if(l.m>11){l.m=0;l.y++}}render();return true;
   case 'newLed':openLedForm(null);return true;
   case 'openLed':var x=S.ledger.filter(function(e){return e.id===id})[0];if(x)openLedForm(x);return true;
   case 'ledTipo':S.ui.ledForm.tipo=el.getAttribute('data-t');S.ui.ledForm.categoria=(S.ui.ledForm.tipo==='entrata'?CAT_IN:CAT_OUT)[0];render();return true;

   case 'gphPick':S.ui.gphKey=el.getAttribute('data-k');{var gf=document.getElementById('gphfile');if(gf)gf.click()}return true;
   case 'gphDel':{var gk=el.getAttribute('data-k');appRoot().collection('guidephotos').doc(gk).delete().then(function(){delete S.gph[gk];render()})}return true;
   case 'guide':S.ui.guide=el.getAttribute('data-g')||null;render();return true;
   case 'reportAI':reportSummaryAI();return true;
   case 'pickP':var fp=document.getElementById('pfile');if(fp)fp.click();return true;

  doc.setDrawColor(LN[0],LN[1],LN[2]);doc.setLineWidth(0.3);doc.roundedRect(x,y,w,h,2,2,'S');

  var curves=PZ.map(function(z){var a=[];for(var i=0;i<=40;i++){var yy=x0+(x1-x0)*i/40,p=cdcLMS(k,sx,yy*12);if(p)a.push([yy,cdcVal(p,z[1])])}return a});
  var all=[];curves.forEach(function(c){c.forEach(function(q){all.push(q[1])})});pts.forEach(function(p){all.push(p.v)});
  var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all),pad=(mx-mn)*0.04;mn-=pad;mx+=pad;
  var W=340,H=210,L=36,R=28,T=10,B=26;
  var X=function(x){return L+(x-x0)/(x1-x0)*(W-L-R)},Y=function(v){return T+(1-(v-mn)/(mx-mn))*(H-T-B)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(title)+'">';
  [0,0.5,1].forEach(function(f){var v=mn+(mx-mn)*f,y=Y(v);s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text x="'+(L-5)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+fmt(v,dec)+'</text>'});
  for(var a=x0;a<=x1;a+=((x1-x0)>8?2:1))s+='<text x="'+X(a).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+a+'</text>';
  curves.forEach(function(c,i){var nm=PZ[i][0],main=nm==='P50',edge=nm==='P3'||nm==='P97';
    s+='<polyline fill="none" stroke="var(--muted)" stroke-width="'+(main?1.6:1)+'" stroke-opacity="'+(main?0.9:edge?0.7:0.4)+'"'+(main||edge?'':' stroke-dasharray="3 3"')+' points="'+c.map(function(q){return X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)}).join(' ')+'"/>';
    var e=c[c.length-1];if(e)s+='<text x="'+(W-R+3)+'" y="'+(Y(e[1])+3).toFixed(1)+'" style="font-size:8px">'+nm+'</text>'});
  if(pts.length>1)s+='<polyline class="ln" points="'+pts.map(function(p){return X(p.y).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p,i){var last=i===pts.length-1;s+='<circle class="'+(last?'pe':'pt')+'" cx="'+X(p.y).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?4.5:3.5)+'"/>'});
  s+='</svg>';
  var lp=pts[pts.length-1],pz=normCdf(cdcZ(lp.v,cdcLMS(k,sx,lp.y*12)))*100;
  return '<div class="card"><div class="row" style="justify-content:space-between;align-items:baseline"><b style="font-family:var(--f-display)">'+esc(title)+'</b><span class="mono small muted">ultima: '+fmt(lp.v,dec)+' '+unit+' · '+pctTxt(pz)+' percentile</span></div>'+s+'<div class="small muted">Asse orizzontale: età in anni. Linee: percentili CDC 2000 (3°, 10°, 25°, 50°, 75°, 90°, 97°).</div>'+pctRead(k,pts,sx,pz)+'</div>'}
function pctRead(k,pts,sx,pz){
  var q=function(x){return Math.max(1,Math.min(99,Math.round(x)))};
  var zona=pz<3?'sotto il 3°, cioè sotto la fascia abituale: da valutare':pz>97?'sopra il 97°, cioè sopra la fascia abituale: da valutare':'dentro la fascia abituale (tra il 3° e il 97°)';
  var t='<p style="margin:8px 0 0"><b>Come leggerlo.</b> Il percentile dice come si colloca rispetto ai coetanei dello stesso sesso: '+pctTxt(pz)+' significa che circa '+q(pz)+' su 100 hanno un valore più basso. La linea P50 è la mediana. Qui il valore è '+zona+'.';
  if(k==='bmi')t+=' Per l\'IMC: '+bmiClass(pz)+' (sotto il 5° sottopeso, 5°-85° nella norma, 85°-95° sovrappeso, dal 95° obesità).';
  t+='</p>';
  if(pts.length>1){
    var f=pts[0],p0=normCdf(cdcZ(f.v,cdcLMS(k,sx,f.y*12)))*100,d=pz-p0;
    t+='<p style="margin:6px 0 0"><b>Andamento.</b> '+(Math.abs(d)<10?'Dalla prima misura il percentile è stabile ('+pctTxt(p0)+' → '+pctTxt(pz)+'): segue la sua curva di crescita.':'Dalla prima misura il percentile è '+(d>0?'salito':'sceso')+' da '+pctTxt(p0)+' a '+pctTxt(pz)+'. Se attraversa due o più linee principali in poco tempo conviene approfondire.')+'</p>'}
  t+='<p style="margin:6px 0 0">Conta più la direzione nel tempo del singolo valore. Sono riferimenti statistici, non una diagnosi: li interpreta il professionista insieme a storia, sviluppo puberale e familiarità.</p>';
  return '<div class="small muted">'+t+'</div>'}
function pctSection(){
  if(!isMinor())return '';
  if(!sexOf())return '<div class="card flat"><b>Percentili di crescita</b><p class="muted" style="margin:6px 0 0">Indica il sesso nella scheda per vedere i percentili.</p></div>';
  var h='';
  h+=pctChart('bmi','IMC per età','kg/m²',1,function(m){var w=num(m.peso),t=num(m.altezza);return w&&t?w/Math.pow(t/100,2):null});
  h+=pctChart('wt','Peso per età','kg',1,function(m){return num(m.peso)});
  h+=pctChart('ht','Altezza per età','cm',1,function(m){return num(m.altezza)});
  if(!h)h='<div class="card flat"><b>Percentili di crescita</b><p class="muted" style="margin:6px 0 0">Le curve CDC coprono da 2 a 20 anni e servono data di nascita (o età), sesso, peso e altezza. Sotto i 2 anni servono le curve OMS, non incluse.</p></div>';
  return h}

/* ---------- Eventi ---------- */
function bindRoot(ch){return ch==='c'?S.client:ch==='d'?S.draft:ch==='u'?S.ui:ch==='p'?ensurePlan().settings:ch==='a'?S.ui.apptForm:ch==='l'?S.ui.ledForm:ch==='r'?S.ui.rep:ch==='s'?S.studio:ch==='t'?ensureTrain().valut:null}
function onInput(e){
  var t=e.target;
  if(t.id==='q'){S.ui.q=t.value;var cl=$('#clist');if(cl)cl.innerHTML=clientList();return}
  var b=t.getAttribute&&t.getAttribute('data-bind');
  if(b){
    var parts=b.split('.'),root=bindRoot(parts[0]);if(!root)return;
    var val=(t.type==='checkbox')?t.checked:t.value;
    if(parts[0]==='p'){
      var key=parts[1];root[key]=(key==='giorni')?parseInt(val,10):val;
      if(S.plan&&S.plan.days&&S.plan.days.length)savePlan();else ensurePlan();
      render();return}
    setPath(root,parts.slice(1),val);
    if(afterBind(parts,val,t))return;
    if(parts[0]==='c'){
      if(parts[1]==='int'){var i=S.client.aiFields.indexOf(parts[2]);if(i>=0&&val)S.client.aiFields[i]=S.client.aiFields[i];}
      saveClient();
      if(parts[1]==='trascrizione'){var bt=$('[data-act="runInt"]');if(bt)bt.disabled=!val.trim()}
      if(parts[1]==='name'){var h1=$('.top h1');if(h1)h1.textContent=val||'Senza nome'}
    }
    if(parts[0]==='d'){
      if(parts[1]==='date')S.draft._dateEdited=true;
      var ai=S.draft.aiKeys.indexOf(parts.slice(1).join('.'));
      var dv=$('#derived');if(dv)dv.innerHTML=derivedHtml();
    }
    if(parts[0]==='u'&&parts[1]==='planChange'){var bp=$('[data-act="revisePlan"]');if(bp)bp.disabled=!val.trim()}
    if(parts[0]==='u'&&parts[1]==='labtext'){var bl=$('[data-act="runLabText"]');if(bl)bl.disabled=!val.trim()}
    return}
  var lab=t.getAttribute&&t.getAttribute('data-lab');
  if(lab){var L=S.labs.filter(function(x){return x.id===lab})[0];if(!L)return;L[t.getAttribute('data-f')]=t.value;saveLabLater(L);
    if(t.getAttribute('data-f')==='titolo'){var sm=t.closest('details').querySelector('summary span');if(sm)sm.textContent=t.value||'Esame'}return}
  var tr=t.getAttribute&&t.getAttribute('data-train');
  if(tr&&S.train){
    var tp=tr.split('.').map(function(x){return /^\d+$/.test(x)?parseInt(x,10):x});
    var tr2=S.train;for(var i3=0;i3<tp.length-1;i3++){tr2=tr2[tp[i3]];if(tr2==null)return}
    var tl=tp[tp.length-1];
    if(tl==='consigli'){tr2[tl]=t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean)}else tr2[tl]=t.value;
    if(tp[0]==='days'&&tp[2]==='nome'&&tp.length===3){var ch2=$('.chip.on');if(ch2)ch2.textContent=t.value||'Giorno'}
    if(tl==='nome'&&tp.length===5){var g0=exGroup(t.value);if(g0&&!tr2.gr){tr2.gr=g0;var gs=document.querySelector('select[data-train="'+tr.replace(/nome$/,'gr')+'"]');if(gs)gs.value=g0}}
    var tv=$('#trvol');if(tv&&tp[0]==='days')tv.innerHTML=trVolume();
    if(tp[0]==='fine'){var fi=$('#fineidx');if(fi)fi.textContent=fineIndex()}
    saveTrain();return}
  var pl=t.getAttribute&&t.getAttribute('data-plan');
  if(pl&&S.plan){
    var pp=pl.split('.').map(function(x){return /^\d+$/.test(x)?parseInt(x,10):x});
    var root2=S.plan;for(var i2=0;i2<pp.length-1;i2++){root2=root2[pp[i2]];if(root2==null)return}
    var last=pp[pp.length-1];
    if(last==='consigli'){root2[last]=t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean)}
    else root2[last]=t.value;
    if(pp[0]==='days'&&pp[2]==='nome'&&pp.length===3){var ch=$('.chip.on');if(ch)ch.textContent=t.value||'Giorno'}
    savePlan()}}

async function onClick(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(moreClick(a,el,id))return;
  switch(a){
   case 'newClient':return newClient();
   case 'open':return openClient(id);
   case 'back':return goBack();
   case 'retry':if(S.saveErr){if(S.client)saveClient(true);S.saveErr=false;setStatus()}return;
   case 'tab':flushAll();S.tab=el.getAttribute('data-t');S.draft=null;S.ui.confirmDel=false;return render();
   case 'stop':return stopAI();
   case 'runInt':return runInterview();
   case 'dictate':return dictToggle();
   case 'pickI':var f3=$('#ifile');if(f3)f3.click();return;
   case 'clearMiss':S.client.mancanti=[];saveClient(true);return render();
   case 'delAsk':S.ui.confirmDel=true;return render();
   case 'delCancel':S.ui.confirmDel=false;return render();
   case 'delClient':return deleteClient();
   case 'newMeasure':S.draft=newDraft();S.err.mform=null;S.err.mfile=null;S.info.mfile=null;S.ui.confirmMDel=false;return render();
   case 'openMeasure':var m=S.measures.filter(function(x){return x.id===id})[0];if(m){S.draft=draftFrom(m);S.err.mform=null;S.err.mfile=null;S.info.mfile=null;S.ui.confirmMDel=false;render()}return;
   case 'draftCancel':S.draft=null;return render();
   case 'pickM':var f1=$('#mfile');if(f1)f1.click();return;
   case 'interpretM':return interpretMeasure();
   case 'saveM':return saveMeasure();
   case 'delMAsk':S.ui.confirmMDel=true;return render();
   case 'delM':return deleteMeasure();
   case 'pickL':var f2=$('#lfile');if(f2)f2.click();return;
   case 'runLabText':return runLabAI(null);
   case 'newLab':return newLab();
   case 'delLabAsk':S.ui.confirmLab=id;return render();
   case 'delLabCancel':S.ui.confirmLab=null;return render();
   case 'delLab':return deleteLab(id);
   case 'regenAsk':S.ui.confirmRegen=true;return render();
   case 'regenCancel':S.ui.confirmRegen=false;return render();
   case 'runPlan':return runPlan();
   case 'blankPlan':var P=ensurePlan();P.days=[{nome:'Giorno 1',pasti:[{nome:'Colazione',ora:'08:00',voci:[]},{nome:'Pranzo',ora:'13:00',voci:[]},{nome:'Cena',ora:'20:00',voci:[]}]}];P.consigli=[];S.ui.day=0;savePlan(true);refreshSummary();saveClient(true);return render();
   case 'day':S.ui.day=parseInt(el.getAttribute('data-i'),10);S.ui.confirmDay=null;return render();
   case 'addDay':S.plan.days.push({nome:'Giorno '+(S.plan.days.length+1),pasti:[{nome:'Colazione',ora:'08:00',voci:[]},{nome:'Pranzo',ora:'13:00',voci:[]},{nome:'Cena',ora:'20:00',voci:[]}]});S.ui.day=S.plan.days.length-1;savePlan();return render();
   case 'delDayAsk':S.ui.confirmDay=S.ui.day;return render();
   case 'delDayCancel':S.ui.confirmDay=null;return render();
   case 'delDay':S.plan.days.splice(S.ui.day,1);S.ui.day=0;S.ui.confirmDay=null;if(!S.plan.days.length)refreshSummary();savePlan();return render();
   case 'addMeal':S.plan.days[S.ui.day].pasti.push({nome:'Nuovo pasto',ora:'',voci:[]});savePlan();return render();
   case 'delMeal':S.plan.days[S.ui.day].pasti.splice(parseInt(el.getAttribute('data-p'),10),1);savePlan();return render();
   case 'crea':{var vv=S.plan.days[S.ui.day].pasti[parseInt(el.getAttribute('data-p'),10)].voci[parseInt(el.getAttribute('data-v'),10)];var nm=(vv&&vv.alimento||'').trim();try{if(nm&&navigator.clipboard)navigator.clipboard.writeText(nm)}catch(e){}window.open('https://www.alimentinutrizione.it/tabelle-nutrizionali/ricerca-per-alimento','_blank','noopener');S.info.plan=nm?('"'+nm+'" copiato: incollalo nella ricerca CREA.'):'Apro la ricerca CREA.';return render()}
   case 'addVoce':S.plan.days[S.ui.day].pasti[parseInt(el.getAttribute('data-p'),10)].voci.push({alimento:'',quantita:'',note:''});savePlan();return render();
   case 'delVoce':S.plan.days[S.ui.day].pasti[parseInt(el.getAttribute('data-p'),10)].voci.splice(parseInt(el.getAttribute('data-v'),10),1);savePlan();return render();
   case 'exportPlan':
     if(!S.downloads){S.err.plan='Il download non è disponibile in questa vista.';return render()}
     try{await S.downloads.save({filename:'piano-'+String(S.client.name||'cliente').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.txt',data:exportPlanText()})}
     catch(er){if(!er||er.code!=='declined'){S.err.plan='Download non riuscito.';render()}}
     return;
  }}

function onChange(e){
  var t=e.target;
  if(t.id==='mfile'&&t.files&&t.files.length){var l=Array.prototype.slice.call(t.files);t.value='';runMeasureAI(l)}
  else if(t.id==='gphfile'&&t.files&&t.files[0]){var gfl=t.files[0],gkey=S.ui.gphKey;t.value='';imgToData(gfl,700,'image/jpeg',0.7).then(function(r){return appRoot().collection('guidephotos').doc(gkey).set({data:r.data}).then(function(){S.gph[gkey]=r.data;render()})},function(){})}
  else if(t.id==='logofile'&&t.files&&t.files[0]){var lg=t.files[0];t.value='';setLogo(lg)}
  else if(t.id==='phfile'&&t.files&&t.files.length){var l5=Array.prototype.slice.call(t.files);t.value='';addPhotos(l5)}
  else if(t.id==='pfile'&&t.files&&t.files.length){var l4=Array.prototype.slice.call(t.files);t.value='';attachPlanFiles(l4)}
  else if(t.id==='ifile'&&t.files&&t.files.length){var l3=Array.prototype.slice.call(t.files);t.value='';runInterview(l3)}
  else if(t.id==='lfile'&&t.files&&t.files.length){var l2=Array.prototype.slice.call(t.files);t.value='';runLabAI(l2)}
  else if(t.id==='exgrp'&&t.value){var T1=ensureTrain(),dd=T1.days[Math.min(S.ui.tday||0,T1.days.length-1)];if(dd){dd.esercizi.push({nome:t.value,serie:'3',rip:'10',rec:'60 s',carico:'',note:'',gr:exGroup(t.value),video:'',storico:[]});saveTrain();render()}}
  else if(t.tagName==='SELECT'&&t.getAttribute('data-bind')){onInput(e)}}

/* ---------- Avvio ---------- */
async function init(){
  document.addEventListener('input',onInput);
  document.addEventListener('change',onChange);
  document.addEventListener('click',onClick);
  document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.tagName==='DETAILS'){var g=d.getAttribute('data-g');if(g){S.ui.open[g]=d.open}}},true);
  document.addEventListener('visibilitychange',function(){if(document.hidden)flushAll()});
  window.addEventListener('pagehide',flushAll);
  S.ui.open={ana:true};
  render();
  try{
    var cl=window.claude;if(!cl||!cl.use)throw new Error('no runtime');
    var r=await Promise.all([cl.use('db'),cl.use('user'),cl.use('sample'),cl.use('downloads')]);
    S.db=r[0];S.sample=r[2];S.downloads=r[3];
    if(r[1]&&r[1].id)S.uid=await r[1].id();
    if(S.sample&&S.sample.limits){try{var lim=await S.sample.limits();S.imgMax=(lim&&lim.images&&lim.images.maxCount)||0}catch(e){S.imgMax=0}}
  }catch(e){}
  S.boot=false;render();
  S.db.collection('data/users/'+S.uid).onSnapshot(function(snap){
    S.clients=snap.docs.map(function(d){var o=clone(d.data())||{};o.id=d.id;return o}).filter(function(o){return o.name!=null});
    S.clientsLoaded=true;
    if(S.view==='list'){var c=$('#clist');if(c)c.innerHTML=clientList()}
  },function(){S.clientsLoaded=true;S.err['new']='Non riesco a leggere i clienti salvati.';if(S.view==='list')render()});
  startExtra();
}
init();
})();
